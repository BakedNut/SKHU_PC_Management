[project]
name = "skhu-pc-management"
version = "0.1.0"
description = "Python PySide6 rewrite scaffold for SKHU PC Management"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "pyinstaller",
    "pytest",
    "pywin32",
    "WMI",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
